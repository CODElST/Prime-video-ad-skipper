<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prime Video Ad Control</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 14px 16px;
      width: 270px;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid rgba(128, 128, 128, 0.3);
      cursor: pointer;
    }
    .text small { display: block; opacity: 0.65; font-size: 12px; }
    .switch { position: relative; width: 38px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .track {
      position: absolute; inset: 0;
      background: #8a8a8a;
      border-radius: 22px;
      transition: background 0.15s;
    }
    .track::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s;
    }
    input:checked + .track { background: #1a73e8; }
    input:checked + .track::before { transform: translateX(16px); }
    input:focus-visible + .track { outline: 2px solid #1a73e8; outline-offset: 2px; }
    #status { margin-top: 8px; font-size: 12px; opacity: 0.65; }
  </style>
</head>
<body>
  <h1>Prime Video Ad Control</h1>

  <label class="row">
    <span class="text">Jump to end of ad
      <small>Experimental. Seeks ahead using the ad timer.</small>
    </span>
    <span class="switch">
      <input type="checkbox" id="jump">
      <span class="track"></span>
    </span>
  </label>

  <label class="row">
    <span class="text">Speed up at 16x
      <small>Plays the ad as fast as the browser allows.</small>
    </span>
    <span class="switch">
      <input type="checkbox" id="speed">
      <span class="track"></span>
    </span>
  </label>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
